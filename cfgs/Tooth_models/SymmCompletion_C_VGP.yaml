optimizer:
  type: AdamW
  kwargs: {lr: 0.0004, weight_decay: 0.0001}
scheduler:
  type: WarmUpCosLR
  kwargs: {warmup_epoch: 5, max_epoch: 400, lr_max: 0.0004, lr_min: 0.00002}
dataset:
  train: {_base_: cfgs/dataset_configs/Tooth_missing_points_c_vgp.yaml, others: {subset: train}}
  val: {_base_: cfgs/dataset_configs/Tooth_missing_points_c_vgp.yaml, others: {subset: test}}
  test: {_base_: cfgs/dataset_configs/Tooth_missing_points_c_vgp.yaml, others: {subset: test}}
model: {NAME: SymmCompletion_missing_points, up_factors: "1, 2", include_input: False, loss_type: cdl2, tau_miss: 0.05, gate_scale: 1.0, mr_weight: 0.3, mr_apply_to: final}
total_bs: 5
step_per_update: 1
max_epoch: 400
consider_metric: CDL2
prototype_source: vgp
k_pred_miss: 10
